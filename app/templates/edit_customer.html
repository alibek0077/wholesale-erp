<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Customer — CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0c10;--surface:#111318;--surface2:#1a1d26;--border:rgba(255,255,255,0.07);--text:#e8eaf0;--text-muted:#6b7280;--text-dim:#9ca3af;--primary:#6366f1;--primary-glow:rgba(99,102,241,0.2);--success:#10b981;--success-bg:rgba(16,185,129,0.1);--warning:#f59e0b;--warning-bg:rgba(245,158,11,0.1);--danger:#ef4444;--danger-bg:rgba(239,68,68,0.1);--sidebar-w:260px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
    .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;}
    .sidebar-brand{padding:22px 20px;border-bottom:1px solid var(--border);}
    .brand-logo{display:flex;align-items:center;gap:10px;}
    .brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#818cf8);display:flex;align-items:center;justify-content:center;font-size:16px;}
    .brand-name{font-size:14px;font-weight:800;letter-spacing:-0.3px;}
    .brand-sub{font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:.8px;text-transform:uppercase;margin-top:1px;}
    .sidebar-nav{padding:14px 12px;flex:1;}
    .nav-label{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin:14px 0 5px;}
    .nav-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text-dim);text-decoration:none;font-weight:500;font-size:13.5px;transition:all .15s;margin-bottom:2px;}
    .nav-link:hover{background:var(--surface2);color:var(--text);}
    .nav-link.active{background:var(--success-bg);color:var(--success);font-weight:600;}
    .nav-link svg{width:16px;height:16px;opacity:.8;flex-shrink:0;}
    .sidebar-footer{padding:14px 12px;border-top:1px solid var(--border);}
    .logout-link{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--danger);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .15s;}
    .logout-link:hover{background:var(--danger-bg);}
    .logout-link svg{width:16px;height:16px;}
    .main{margin-left:var(--sidebar-w);min-height:100vh;}
    .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
    .topbar-left h1{font-size:15px;font-weight:700;}
    .topbar-left p{font-size:12px;color:var(--text-muted);}
    .content{padding:28px;display:flex;justify-content:center;}
    .edit-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;width:100%;max-width:540px;animation:fadeUp .4s ease both;}
    .edit-card-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
    .avatar-lg{width:44px;height:44px;border-radius:12px;background:var(--success-bg);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--success);}
    .edit-title{font-size:15px;font-weight:700;}
    .edit-sub{font-size:12px;color:var(--text-muted);margin-top:1px;font-family:'JetBrains Mono',monospace;}
    .edit-card-body{padding:24px;}
    .form-group{margin-bottom:18px;}
    .form-label{display:block;margin-bottom:7px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;}
    .form-control{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13.5px;font-family:inherit;transition:border-color .15s,box-shadow .15s;outline:none;}
    .form-control:focus{border-color:var(--success);box-shadow:0 0 0 3px var(--success-bg);}
    .form-actions{display:flex;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all .15s;font-family:inherit;}
    .btn-success{background:var(--success);color:#fff;}
    .btn-success:hover{background:#0da472;box-shadow:0 0 0 3px var(--success-bg);}
    .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
    .btn-ghost:hover{background:var(--surface2);color:var(--text);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">
      <div class="brand-icon">🧵</div>
      <div><div class="brand-name">WholesaleMS</div><div class="brand-sub">ERP · CRM · WMS</div></div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Main</div>
    <a href="/dashboard" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <div class="nav-label">Modules</div>
    <a href="/products" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      ERP — Products
    </a>
    <a href="/customers" class="nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      CRM — Customers
    </a>
    <a href="/warehouse" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      WMS — Warehouse
    </a>
  </nav>
  <div class="sidebar-footer">
    <a href="/logout" class="logout-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign Out
    </a>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <h1>Edit Customer</h1>
      <p>CRM — Update customer information</p>
    </div>
    <a href="/customers" class="btn btn-ghost" style="font-size:12px;padding:7px 14px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to Customers
    </a>
  </header>

  <div class="content">
    <div class="edit-card">
      <div class="edit-card-header">
        <div class="avatar-lg">{{ customer.name[0] | upper }}</div>
        <div>
          <div class="edit-title">{{ customer.name }}</div>
          <div class="edit-sub">Customer ID #{{ customer.id }}</div>
        </div>
      </div>
      <div class="edit-card-body">
        <form method="POST" action="/customers/update/{{ customer.id }}">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="name" value="{{ customer.name }}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" name="phone" value="{{ customer.phone }}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" name="email" value="{{ customer.email }}" required>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-success">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v14a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Save Changes
            </button>
            <a href="/customers" class="btn btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
